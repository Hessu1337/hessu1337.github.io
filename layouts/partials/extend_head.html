{{- /* Custom head content for spring petals effect */ -}}
<style>
.petal {
  position: fixed;
  top: -10px;
  z-index: 9999;
  user-select: none;
  cursor: default;
  font-size: 1em;
  opacity: 0.9;
  pointer-events: none;
}

.petal.falling {
  animation-name: petalfall;
  animation-timing-function: linear;
  animation-iteration-count: 1;
  animation-fill-mode: forwards;
}

.petal.stopped {
  animation: none !important;
}

.petal.wind-sweep {
  animation: windSweep 3s ease-out forwards !important;
  --sweepX: 150vw;
  --sweepY: -50vh;
  --rotation: 720deg;
}

@keyframes windSweep {
  0% {
    transform: translateX(0) translateY(0) rotate(0deg);
    opacity: 1;
  }
  100% {
    transform: translateX(var(--sweepX)) translateY(var(--sweepY)) rotate(var(--rotation));
    opacity: 0;
  }
}

@keyframes petalfallLeft {
  0% {
    transform: translateX(0) translateY(0vh) rotate(0deg);
    opacity: 1;
  }
  100% {
    transform: translateX(-30px) translateY(100vh) rotate(360deg);
    opacity: 0.4;
  }
}

@keyframes petalfallRight {
  0% {
    transform: translateX(0) translateY(0vh) rotate(0deg);
    opacity: 1;
  }
  100% {
    transform: translateX(30px) translateY(100vh) rotate(360deg);
    opacity: 0.4;
  }
}

@keyframes petalfallStraight {
  0% {
    transform: translateX(0) translateY(0vh) rotate(0deg);
    opacity: 1;
  }
  100% {
    transform: translateX(0) translateY(100vh) rotate(360deg);
    opacity: 0.4;
  }
}
</style>

<script>
(function() {
  const petals = ['🌸', '🌺', '🌼', '🏵️'];
  const numPetals = 35;
  const stopProbability = 0.35; // 35% chance to stop
  let allPetals = [];
  
  function createPetal() {
    const petal = document.createElement('div');
    petal.className = 'petal falling';
    petal.textContent = petals[Math.floor(Math.random() * petals.length)];
    petal.style.left = Math.random() * 100 + '%';
    petal.style.fontSize = (Math.random() * 0.8 + 0.8) + 'em';
    
    const duration = Math.random() * 5 + 8;
    petal.style.animationDuration = duration + 's';
    
    // Randomly choose a falling direction
    const directions = ['petalfallLeft', 'petalfallRight', 'petalfallStraight'];
    const randomDirection = directions[Math.floor(Math.random() * directions.length)];
    petal.style.animationName = randomDirection;
    
    document.body.appendChild(petal);
    allPetals.push(petal);
    
    // Decide if this petal should stop mid-fall
    if (Math.random() < stopProbability) {
      const stopTime = Math.random() * 0.7 + 0.15; // Stop between 15% and 85% of the fall
      const stopDelay = duration * stopTime * 1000;
      
      setTimeout(() => {
        if (petal && petal.parentElement && !petal.classList.contains('wind-sweep')) {
          const rect = petal.getBoundingClientRect();
          petal.classList.remove('falling');
          petal.classList.add('stopped');
          petal.style.top = rect.top + 'px';
          petal.style.left = rect.left + 'px';
          petal.style.animation = 'none';
        }
      }, stopDelay);
    }
    
    // Remove and recreate after duration (if not stopped)
    setTimeout(() => {
      if (petal && petal.parentElement && !petal.classList.contains('stopped')) {
        const index = allPetals.indexOf(petal);
        if (index > -1) allPetals.splice(index, 1);
        petal.remove();
        createPetal();
      }
    }, duration * 1000);
  }
  
  // Wind sweep effect
  function triggerWind() {
    // Sweep all existing petals with varied directions
    allPetals.forEach(petal => {
      if (petal && petal.parentElement) {
        petal.classList.add('wind-sweep');
        petal.classList.remove('falling', 'stopped');
        
        // Vary the wind direction for each petal
        const sweepX = Math.random() * 100 + 100; // 100-200vw
        const sweepY = Math.random() * 60 - 30; // -30 to 30vh (some up, some down)
        const rotation = Math.random() * 360 + 360; // 360-720 degrees
        
        petal.style.setProperty('--sweepX', sweepX + 'vw');
        petal.style.setProperty('--sweepY', sweepY + 'vh');
        petal.style.setProperty('--rotation', rotation + 'deg');
      }
    });
    
    // Remove all petals after animation
    setTimeout(() => {
      allPetals.forEach(petal => {
        if (petal && petal.parentElement) {
          petal.remove();
        }
      });
      allPetals = [];
      
      // Recreate all petals
      for (let i = 0; i < numPetals; i++) {
        setTimeout(() => createPetal(), i * 300);
      }
    }, 3000);
    
    // Schedule next wind
    setTimeout(triggerWind, 20000); // Every 20 seconds
  }
  
  if (typeof window !== 'undefined') {
    window.addEventListener('load', function() {
      // Start falling petals
      for (let i = 0; i < numPetals; i++) {
        setTimeout(() => createPetal(), i * 300);
      }
      
      // First wind after 20 seconds
      setTimeout(triggerWind, 20000);
    });
  }
})();
</script>
